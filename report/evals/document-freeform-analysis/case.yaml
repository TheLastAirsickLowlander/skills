schema_version: "1.1"
name: document-freeform-analysis
expected_outcome: |
  The agent auto-detects cache-analysis.md as the analysis source and writes one
  self-contained HTML report in STE-inspired language. The report keeps the source
  numbers accurate (hit rate 92 % to 71 %, p95 340 ms to 890 ms, key cardinality
  4100 to 61000 per hour, recovery to 90 % and 355 ms after rollback), includes at
  least one labeled inline-SVG figure with units, states the conclusion and the
  next steps, and invents no data beyond the source.
context:
  scaffold_script: place-files.sh
